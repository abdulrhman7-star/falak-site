<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لا يوجد اتصال — فلك Falak</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #07080b;
    color: #f8fafc;
    font-family: 'Cairo', system-ui, sans-serif;
    text-align: center;
    padding: 20px;
  }
  .offline-box {
    max-width: 400px;
  }
  .offline-icon {
    font-size: 80px;
    margin-bottom: 20px;
    animation: float 2s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  h1 {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #ff2a33, #c40810);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  p {
    font-size: 14px;
    color: #94a3b8;
    line-height: 1.8;
    margin-bottom: 24px;
  }
  button {
    padding: 12px 32px;
    background: linear-gradient(135deg, #ff2a33, #c40810);
    color: #fff;
    border: none;
    border-radius: 9999px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 30, 39, 0.35);
    transition: transform 0.2s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(255, 30, 39, 0.5);
  }
</style>
</head>
<body>
  <div class="offline-box">
    <div class="offline-icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يبدو أنك غير متصل بالإنترنت. تحقق من اتصالك ثم حاول مرة أخرى.</p>
    <button onclick="location.reload()">🔄 إعادة المحاولة</button>
  </div>
</body>
</html>
